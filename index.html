<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" id="questionBox">
  <h1>Will you be my Valentine, <span id="name"></span>? 💘</h1>
  <div class="buttons">
    <button id="yesBtn">Yes 😍</button>
    <button id="noBtn">No 🙄</button>
  </div>
</div>

<div class="container hidden" id="loveBox">
  <h1>I love you my love, <span id="loveName"></span> ❤️</h1>
  <video autoplay loop muted>
    <source src="assets/love.mp4" type="video/mp4">
  </video>
  <p>You just made my heart smile 💕</p>
</div>

<script src="script.js"></script>
</body>
</html>
